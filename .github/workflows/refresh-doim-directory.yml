name: Refresh DOIM directory

on:
  schedule:
    # Weekly public-directory refresh; the guarded result is proposed for review.
    - cron: "37 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: doim-directory-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Restore locked environment
        run: uv sync --locked --all-extras --dev

      - name: Verify code before collecting
        run: uv run --locked pytest

      - name: Collect guarded DOIM directory
        run: >-
          uv run --locked doim-directory --collect --strict
          --max-drop-ratio 0.25 --min-faculty 1

      - name: Propose the refreshed directory
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "data: refresh DOIM faculty directory"
          title: "data: refresh DOIM faculty directory"
          body: |
            Automated weekly refresh of the public University of Utah Department of Internal Medicine faculty directory.

            The collector requires every division source to succeed and refuses a total or per-division faculty drop greater than 25%.
          branch: automation/doim-directory-refresh
          delete-branch: true
          add-paths: |
            data/directory.json
            site/data/directory.json

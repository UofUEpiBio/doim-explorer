name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Restore locked environment
        run: uv sync --locked --all-extras --dev

      - name: Lint DOIM application code and tests
        run: uv run --locked ruff check doim_explorer server tests

      - name: Run the DOIM test suite
        run: uv run --locked pytest

name: Refresh selected DOIM faculty

on:
  workflow_dispatch:
    inputs:
      faculty_ids:
        description: "Comma or whitespace separated stable U of U faculty IDs"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: doim-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true

      - run: uv python install
      - run: uv sync --locked --all-extras --dev
      - run: uv run --locked pytest

      - name: Authenticate for Vertex embeddings
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Refresh selected faculty, publications, and retrieval index
        env:
          FACULTY_IDS: ${{ inputs.faculty_ids }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ vars.GCP_REGION }}
          RESEARCH_EXPLORER_CONTACT_EMAIL: ${{ vars.RESEARCH_EXPLORER_CONTACT_EMAIL }}
        run: |
          test -n "$RESEARCH_EXPLORER_CONTACT_EMAIL" || {
            echo "Set the RESEARCH_EXPLORER_CONTACT_EMAIL repository variable before collecting PubMed."
            exit 1
          }
          uv run --locked doim-refresh --faculty-ids "$FACULTY_IDS"
          uv run --locked doim-release-check --local-only

      - name: Propose the targeted refresh
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            data: refresh selected DOIM faculty

            Co-authored-by: OpenAI Codex <noreply@openai.com>
          title: "data: refresh selected DOIM faculty"
          body: |
            Targeted faculty refresh for `${{ inputs.faculty_ids }}` from accepted main data.

            The command refreshed only those U of U profiles and publication sources, then rebuilt the complete retrieval index with vector reuse.
          branch: automation/doim-faculty-refresh
          delete-branch: true
          add-paths: |
            data/directory.json
            data/publications.json
            data/publication-details.json
            data/rag/**
            site/data/directory.json
            site/data/publications.json
            site/data/publication-details.json

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "doim-explorer"
version = "0.2.0"
description = "Unofficial research and faculty explorer for University of Utah Internal Medicine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "research-explorer-core @ git+https://github.com/UofUEpiBio/research-explorer-core.git@v0.2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.6,<1",
]
# Only the retrieval index needs these. The tests inject a stub embedder instead, so
# the core collection pipeline stays installable without a cloud SDK.
rag = [
  "google-genai>=1.0,<2",
  "numpy>=1.26,<3",
]
# The Cloud Run service. A superset of `rag`, listed explicitly so the lock file does
# not depend on self-referencing extras.
server = [
  "google-genai>=1.0,<2",
  "numpy>=1.26,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "google-cloud-firestore>=2.16,<3",
  "httpx>=0.27,<1",
]

[project.scripts]
doim-directory = "doim_explorer.update:directory_main"
doim-update = "doim_explorer.update:main"
doim-publications = "doim_explorer.update:works_main"
doim-rag = "doim_explorer.update:rag_main"

[tool.setuptools.packages.find]
include = ["doim_explorer*", "server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

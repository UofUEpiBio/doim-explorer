# Public configuration for the unofficial explorer.  This does not grant permission
# to use University trademarks. Leave `assets.mark` empty until a properly approved
# local mark is supplied; the site uses the configured text masthead in the meantime.
schema_version = 1

[site]
title = "DOIM Explorer"
subtitle = "University of Utah Department of Internal Medicine"
official_name = "University of Utah Department of Internal Medicine"
official_url = "https://medicine.utah.edu/internal-medicine"
unofficial_notice = "This is an unofficial University of Utah Department of Internal Medicine explorer."

[theme]
# Utah Red, black, and white are the primary colors. The warm accent is used sparingly.
primary = "#BE0000"
primary_dark = "#890000"
accent = "#FFB81D"
ink = "#171717"
muted = "#5A5A5A"
paper = "#F7F7F5"
line = "#D9D9D6"

[assets]
# Filenames are resolved within site/assets/. A mark remains optional for this
# unofficial site; never add an official University mark without written approval.
mark = ""
favicon = ""
social_card = "doim-explorer-social-card.png"

[analytics]
# Leave blank to disable analytics. A Google Analytics measurement ID is public, but
# must be intentionally configured before the browser loads gtag.js.
measurement_id = ""
